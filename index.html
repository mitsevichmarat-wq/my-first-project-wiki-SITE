<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <title>Генератор научных фактов</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app-root">
    <header class="app-header">
      <h1 class="app-title">Генератор научных фактов</h1>
      <p class="app-subtitle">Физика · Биология · Обществознание · Математика</p>
    </header>

    <main class="app-main">
      <section class="fact-card" id="fact-card">
        <div class="fact-category" id="fact-category"></div>
        <h2 class="fact-title" id="fact-title">Нажмите кнопку, чтобы узнать новый факт</h2>
        <p class="fact-text" id="fact-text"></p>
      </section>
    </main>

    <footer class="app-footer">
      <button class="fact-button" id="fact-button">
        Узнать новый факт
      </button>
      <div class="app-footer-copy">
        spacepirat 
      </div>
    </footer>
  </div>

  <script src="script.js"></script>
</body>
</html>
